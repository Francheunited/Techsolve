<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Técnico - TechSolve</title>
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../data/datos-locales.js" defer></script>
    <script src="../js/datos.js" defer></script>
    <script src="../js/navegacion.js" defer></script>
    <script src="../js/panel-tecnico.js" defer></script>
</head>

<body>
    <header>
        <div class="logo">
            <img src="../img/logo.jpg" alt="Logo TechSolve">
            <h1>TechSolve</h1>
        </div>
        <nav>
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="login.html">Iniciar sesión</a></li>
                <li><a href="registrar-ticket.html">Registrar Ticket</a></li>
                <li><a href="mis-tickets.html">Mis Tickets</a></li>
                <li data-panel-tecnico hidden><a href="panel-tecnico.html" class="active">Panel Técnico</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="page-header">
            <h2>Panel Técnico</h2>
            <p>¡Bienvenido al panel técnico!. Aquí se gestionan el estado de los tickets.</p>
        </section>

        <section class="content-card">
            <h3>Ticket registrados en el sistema</h3>
            <table class="tabla-tickets">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Categoría</th>
                        <th>Descripción</th>
                        <th>Estado</th>
                        <th>Prioridad</th>
                    </tr>
                </thead>
                <tbody id="panelTicketsContainer"></tbody>
            </table>
            <p id="panelTicketsMessage" role="status"></p>
        </section>

    </main>

</body>

</html>
